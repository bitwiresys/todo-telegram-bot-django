[project]
name = "todo-telegram"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "Django==5.1.4",
  "djangorestframework==3.15.2",
  "django-filter==24.3",
  "psycopg[binary]==3.2.3",
  "redis==5.2.0",
  "celery==5.4.0",
  "httpx==0.27.2",
  "gunicorn==23.0.0",
  "python-dotenv==1.0.1",
  "aiogram==3.13.1",
  "aiogram-dialog==2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-django==4.9.0",
  "pytest-cov==6.0.0",
  "ruff==0.8.2",
  "mypy==1.13.0",
  "django-stubs==5.1.1",
  "djangorestframework-stubs==3.15.1",
  "types-python-dateutil==2.9.0.20241003",
  "types-redis==4.6.0.20241004",
]

[build-system]
requires = ["setuptools>=75.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "bot*"]

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
exclude = '(^backend/apps/.*/migrations/|^backend/config/settings\.py$)'

[[tool.mypy.overrides]]
module = [
  "aiogram.*",
  "aiogram_dialog.*",
  "celery.*",
  "django_filters.*",
  "redis.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["backend.apps.todo.filters"]
disallow_subclassing_any = false

[tool.django-stubs]
django_settings_module = "backend.config.settings"

[tool.coverage.run]
branch = true
source = ["backend", "bot"]
omit = [
  "*/migrations/*",
  "*/settings.py",
  "*/manage.py",
  "*/wsgi.py",
  "*/asgi.py",
]

[tool.coverage.report]
fail_under = 75
skip_empty = true
